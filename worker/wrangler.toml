name = "hanoi-guide-chatbot"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# "gemini" hoặc "claude"
PROVIDER = "gemini"
# Bỏ trống để dùng mặc định (gemini-2.5-flash / claude-haiku-4-5-20251001)
MODEL = ""
# Domain đang host website tĩnh (Worker sẽ fetch /data/places.json, foods.json, itineraries.json từ đây)
SITE_ORIGIN = "https://your-team.github.io/hanoi-guide"
# Danh sách origin được phép gọi, cách nhau bởi dấu phẩy. Để "*" khi dev.
ALLOWED_ORIGINS = "*"

# Secrets (KHÔNG ghi vào file này):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put CLAUDE_API_KEY
